<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Pulse Animation -->
    <style>
      .pulse-line {
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: dash 6s ease-in-out infinite;
      }
      .badge-glow:hover {
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
      }
      @keyframes dash {
        0%, 100% { stroke-dashoffset: 800; opacity: 0.3; }
        50% { stroke-dashoffset: 0; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <!-- Animated Neon Circuit Line -->
  <path class="pulse-line" d="M 50 180 Q 250 120 450 180 T 850 140" fill="none" stroke="url(#glowGrad)" stroke-width="2"/>

  <!-- Header Title -->
  <g transform="translate(60, 65)">
    <!-- Icon Symbol -->
    <rect width="44" height="44" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 14 22 L 22 14 L 30 22 L 22 30 Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="22" cy="22" r="3" fill="#818cf8"/>

    <!-- Text -->
    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="1">
      TokenSaver
    </text>
    <text x="215" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      v1.0.0
    </text>
    <text x="60" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Active Lossless Session Ledger &amp; Dual-Channel Cognitive Token Optimizer
    </text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(60, 150)">
    <!-- Badge 1: Token Savings -->
    <g class="badge-glow" transform="translate(0, 0)">
      <rect width="180" height="42" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#10b981"/>
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">
        -80% Token Burn
      </text>
    </g>

    <!-- Badge 2: Lossless Code Memory -->
    <g class="badge-glow" transform="translate(195, 0)">
      <rect width="190" height="42" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#38bdf8"/>
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">
        Lossless Code Ledger
      </text>
    </g>

    <!-- Badge 3: Thinking Dual-Channel -->
    <g class="badge-glow" transform="translate(400, 0)">
      <rect width="185" height="42" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#c084fc"/>
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">
        Dual-Mode CoT
      </text>
    </g>

    <!-- Badge 4: Zero Dependencies -->
    <g class="badge-glow" transform="translate(600, 0)">
      <rect width="180" height="42" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#fbbf24"/>
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">
        Zero Dependencies
      </text>
    </g>
  </g>
</svg>

