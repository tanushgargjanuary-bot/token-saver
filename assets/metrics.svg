<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="barRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <text x="35" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
    📊 BENCHMARK COMPARISON: UNCOMPRESSED VS TOKENSAVER
  </text>
  <text x="35" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">
    Measured on Claude 3.5, Gemini 1.5 Pro, and GPT-4o tokenizers.
  </text>

  <!-- Metric 1: Pytest Logs -->
  <g transform="translate(35, 75)">
    <text x="0" y="12" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Pytest / Error Logs</text>
    <!-- Before Bar -->
    <rect x="180" y="0" width="480" height="15" rx="4" fill="url(#barRed)"/>
    <text x="670" y="12" font-family="monospace" font-size="11" fill="#fca5a5">350 tokens (100%)</text>
    <!-- After Bar -->
    <rect x="180" y="19" width="105" height="15" rx="4" fill="url(#barGreen)"/>
    <text x="295" y="31" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">75 tokens (-78%)</text>
  </g>

  <!-- Metric 2: Git Diffs -->
  <g transform="translate(35, 125)">
    <text x="0" y="12" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Git Diffs</text>
    <!-- Before Bar -->
    <rect x="180" y="0" width="380" height="15" rx="4" fill="url(#barRed)"/>
    <text x="570" y="12" font-family="monospace" font-size="11" fill="#fca5a5">180 tokens (100%)</text>
    <!-- After Bar -->
    <rect x="180" y="19" width="95" height="15" rx="4" fill="url(#barGreen)"/>
    <text x="285" y="31" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">45 tokens (-75%)</text>
  </g>

  <!-- Metric 3: Internal CoT (Thinking) -->
  <g transform="translate(35, 175)">
    <text x="0" y="12" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Model Internal CoT</text>
    <!-- Before Bar -->
    <rect x="180" y="0" width="300" height="15" rx="4" fill="url(#barRed)"/>
    <text x="490" y="12" font-family="monospace" font-size="11" fill="#fca5a5">90 tokens (100%)</text>
    <!-- After Bar -->
    <rect x="180" y="19" width="75" height="15" rx="4" fill="url(#barGreen)"/>
    <text x="265" y="31" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">22 tokens (-75%)</text>
  </g>
</svg>

