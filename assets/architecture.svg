<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="360" rx="16" fill="#030712"/>

  <!-- Left Column: Inbound Bloat -->
  <g transform="translate(40, 40)">
    <rect width="230" height="280" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f87171">
      ⚠️ BLOATED INPUT CONTEXT
    </text>
    
    <!-- Item 1 -->
    <rect x="20" y="55" width="190" height="48" rx="6" fill="#1e293b"/>
    <text x="32" y="76" font-family="monospace" font-size="11" fill="#cbd5e1">Pytest Traces</text>
    <text x="32" y="92" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">~350 tokens (80+ lines)</text>

    <!-- Item 2 -->
    <rect x="20" y="115" width="190" height="48" rx="6" fill="#1e293b"/>
    <text x="32" y="136" font-family="monospace" font-size="11" fill="#cbd5e1">Full Code Dumps</text>
    <text x="32" y="152" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Repeated function bodies</text>

    <!-- Item 3 -->
    <rect x="20" y="175" width="190" height="48" rx="6" fill="#1e293b"/>
    <text x="32" y="196" font-family="monospace" font-size="11" fill="#cbd5e1">Chat History</text>
    <text x="32" y="212" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Vague summaries, lost code</text>

    <!-- Item 4 -->
    <rect x="20" y="235" width="190" height="30" rx="6" fill="#450a0a"/>
    <text x="32" y="254" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">Context Window Death Spiral</text>
  </g>

  <!-- Flow Arrow Left -> Center -->
  <path d="M 285 180 L 335 180" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="335,175 345,180 335,185" fill="#64748b"/>

  <!-- Center Column: TokenSaver Engine -->
  <g transform="translate(350, 40)">
    <rect width="250" height="280" rx="12" fill="url(#engineGrad)" stroke="#6366f1" stroke-width="2"/>
    <text x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#a5b4fc">
      ⚡ TOKENSAVER ENGINE
    </text>

    <!-- Feature 1: Thought Tokenizer -->
    <rect x="20" y="55" width="210" height="44" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1"/>
    <text x="32" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">1. Thought Tokenizer</text>
    <text x="32" y="90" font-family="monospace" font-size="10" fill="#cbd5e1">Words -> Concepts -> Tokens</text>

    <!-- Feature 2: AST Skeletonizer -->
    <rect x="20" y="108" width="210" height="44" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1"/>
    <text x="32" y="127" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#818cf8">2. AST Skeletonizer</text>
    <text x="32" y="143" font-family="monospace" font-size="10" fill="#cbd5e1">Strips bodies, locks types</text>

    <!-- Feature 3: Active Session Ledger -->
    <rect x="20" y="161" width="210" height="44" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1"/>
    <text x="32" y="180" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">3. Active Session Ledger</text>
    <text x="32" y="196" font-family="monospace" font-size="10" fill="#cbd5e1">#REF:hash code registry</text>

    <!-- Feature 4: Prompt Caching Governor -->
    <rect x="20" y="214" width="210" height="44" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1"/>
    <text x="32" y="233" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">4. Caching Governor</text>
    <text x="32" y="249" font-family="monospace" font-size="10" fill="#cbd5e1">90% off cached prefixes</text>
  </g>

  <!-- Flow Arrow Center -> Right -->
  <path d="M 615 180 L 665 180" stroke="#6366f1" stroke-width="2"/>
  <polygon points="665,175 675,180 665,185" fill="#6366f1"/>

  <!-- Right Column: Dual-Channel Output -->
  <g transform="translate(680, 40)">
    <rect width="180" height="280" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#34d399">
      ✨ DUAL-CHANNEL OUTPUT
    </text>

    <!-- Channel 1: Background CoT -->
    <rect x="15" y="60" width="150" height="90" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="25" y="82" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">CHANNEL 1</text>
    <text x="25" y="98" font-family="-apple-system, sans-serif" font-size="10" fill="#d1fae5">Internal &lt;thought&gt;</text>
    <text x="25" y="122" font-family="monospace" font-size="10" font-weight="700" fill="#6ee7b7">@E @T @F Macros</text>
    <text x="25" y="138" font-family="-apple-system, sans-serif" font-size="10" fill="#a7f3d0">(-75% Output Tokens)</text>

    <!-- Channel 2: User Response -->
    <rect x="15" y="165" width="150" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="187" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">CHANNEL 2</text>
    <text x="25" y="203" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">User &lt;response&gt;</text>
    <text x="25" y="227" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">100% Natural</text>
    <text x="25" y="243" font-family="-apple-system, sans-serif" font-size="10" fill="#38bdf8">Zero Cryptic Leaks</text>
  </g>
</svg>

